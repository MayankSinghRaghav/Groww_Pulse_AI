name: Groww Pulsator Automated Ingestion Pipeline

on:
  schedule:
    # Weekly review digest — every Monday at 00:00 UTC.
    # (Was '0 0 */8 * *', which resets each month to days 1/9/17/25, not a clean 8-day cadence.)
    - cron: '0 0 * * 1'
  workflow_dispatch:
    # Allow manual triggers at any time from GitHub UI

permissions:
  contents: write   # required so the bot can push the generated data back to main

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libffi-dev

    - name: Install Python Dependencies
      run: |
        pip install --upgrade pip
        pip install -r backend/requirements.txt
        # Forced install of urllib3 to avoid app-store-scraper dependency issues
        pip install urllib3==1.26.15

    - name: Execute Groww Pulsator Pipeline
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        APP_NAME: Groww
      run: |
        python backend/run_pipeline.py

    - name: Commit and Push Processed Review Insights
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # Force-add generated data: these paths are in .gitignore, so a plain
        # `git add` is a silent no-op and the commit below never happens.
        # -f overrides the ignore; adding the dirs avoids "pathspec did not match"
        # failures when an optional output (e.g. a PDF) wasn't produced this run.
        git add -f backend/data/processed backend/data/outputs

        # Check if there are changes to commit
        if git diff-index --quiet HEAD --; then
          echo "No new reviews or generated briefs to commit."
        else
          git commit -m "Automated Ingestion Pipeline run (Every 8 Days)"
          git push origin main
        fi
